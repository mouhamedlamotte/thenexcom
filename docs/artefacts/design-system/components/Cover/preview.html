<!-- @dsCard height=288 -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
body{margin:0;background:var(--surface)}
.cover{position:relative;width:960px;height:288px;background:var(--surface);overflow:hidden}
.cover svg{position:absolute;left:0;top:0}
.b-indigo{fill:var(--indigo)}
.b-encre{fill:var(--encre)}
.b-corail{fill:var(--corail)}
.b-beurre{fill:var(--beurre)}
.b-menthe{fill:var(--menthe)}
.p-craie{fill:var(--craie)}
.p-nuit{fill:var(--nuit)}
.sq{rx:var(--radius-0)}
.name{position:absolute;left:48px;bottom:58px;max-width:440px;font-family:var(--font-display);font-size:120px;line-height:.9;letter-spacing:-.03em;color:var(--encre)}
.tag{position:absolute;left:52px;bottom:30px;max-width:440px;font-family:var(--font-sans);font-size:13px;letter-spacing:.04em;color:var(--encre-douce)}
</style>
</head>
<body>
<div class="cover">
<!--
blocks: indigo 288×192, encre 192×96, corail 192×192, beurre 144×96, menthe 144×96 — sides in multiples of space-12 (48px), corners radius-0.
arrangement: flush modular grid from x=480 to the right edge, corail slab bottom-right, encre band above it.
pattern: literal motif, the logo's chevrons (>< meeting at the tip) — "le < et le > du code qui se rejoignent" — 24 small pairs in craie on indigo, one large pair in nuit on corail.
scales: pitch space-12 (48px), unit 24px, square corners radius-0.
-->
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<rect class="b-indigo sq" x="480" y="0" width="288" height="192"></rect>
<rect class="b-encre sq" x="768" y="0" width="192" height="96"></rect>
<rect class="b-corail sq" x="768" y="96" width="192" height="192"></rect>
<rect class="b-beurre sq" x="480" y="192" width="144" height="96"></rect>
<rect class="b-menthe sq" x="624" y="192" width="144" height="96"></rect>
<g class="p-craie" id="pat"></g>
<g class="p-nuit" transform="translate(816 144) scale(0.96)">
<polygon points="0,0 20,0 53,50 20,100 0,100 33,50"></polygon>
<polygon points="100,0 80,0 47,50 80,100 100,100 67,50"></polygon>
</g>
</svg>
<div class="name">nexcom</div>
<div class="tag">Développement sur mesure · Dakar · The Nexcom × Mouhamed Lamotte</div>
</div>
<script>
(function(){
  var g=document.getElementById('pat'), ns='http://www.w3.org/2000/svg';
  for(var r=0;r<4;r++){for(var c=0;c<6;c++){
    var x=492+c*48, y=12+r*48, s=0.24;
    var grp=document.createElementNS(ns,'g');
    grp.setAttribute('transform','translate('+x+' '+y+') scale('+s+')');
    ['0,0 20,0 53,50 20,100 0,100 33,50','100,0 80,0 47,50 80,100 100,100 67,50'].forEach(function(p){
      var poly=document.createElementNS(ns,'polygon'); poly.setAttribute('points',p); grp.appendChild(poly);
    });
    g.appendChild(grp);
  }}
})();
</script>
</body>
</html>
